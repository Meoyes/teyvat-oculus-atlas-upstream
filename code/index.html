<script>
/* 代码包看门狗 ------------------------------------------------------------
   上游下发的界面代码如果启动不起来，自动回退到上一版，避免一次坏提交把所有人锁死。
   只在「这个版本还没成功启动过」（pendingBoot === version）时才上岗——
   已经被证明能跑的版本永远不会触发回退。
   判定：页面 load 后 12 秒仍未注册 window.__GEL（脚本没跑起来），或 boot 明确报错。
   慢网络不算失败：只要 __GEL 存在就说明脚本已就位，只是数据还没到。 */
(function () {
  var KEY = 'gel.code.v1';
  var META = 'gel-code-meta';
  var ACTIVE = '/__code__/active';
  var st;
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return; }
  if (!st || !st.version || st.pendingBoot !== st.version) return;
  var BROKEN = st.version;
  function activeUrl() { return new URL(ACTIVE, location.origin).href; }
  function patch(fn) {
    var s;
    try { s = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { s = {}; }
    fn(s);
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* 忽略 */ }
  }
  function rollback() {
    if (!window.caches) return;
    caches.open(META).then(function (c) {
      return c.match(activeUrl()).then(function (r) { return r ? r.json() : null; });
    }).then(function (meta) {
      var prev = meta && meta.prev;
      if (!prev) return false;
      return caches.open(META).then(function (c) {
        return c.put(activeUrl(), new Response(JSON.stringify({
          version: prev, prev: null, at: Date.now(),
        }), { headers: { 'Content-Type': 'application/json' } }));
      }).then(function () { return true; });
    }).then(function (ok) {
      /* 回退成功则切回上一版；无论成败都把坏版本标记为 blocked，不再反复重试 */
      patch(function (s) {
        s.blocked = BROKEN;
        delete s.pendingBoot;
      });
      if (ok) location.reload();
    }).catch(function () {});
  }
  function check() {
    var app = window.__GEL;
    if (app && app.booted) { patch(function (s) { delete s.pendingBoot; }); return; }
    if (app && !app.bootError) return;   // 脚本在跑、只是数据慢，不算失败
    rollback();
  }
  if (document.readyState === 'complete') setTimeout(check, 12000);
  else window.addEventListener('load', function () { setTimeout(check, 12000); });
})();
</script>
